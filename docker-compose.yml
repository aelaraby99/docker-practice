version: "3"
services: 
  node-app: 
    image: aelaraby999/express-node-app
    env_file:
      - ./.env
    depends_on:
      - mongo-db
      - postgres-db
  mongo-db:
    container_name: mongo-db-container
    image: mongo
    volumes:
      - mongo-db:/data/db
    ports:
      - "27017:27017"
    restart: always # To restart the container if it stops
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: P@ssw0rd
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:P%40ssw0rd@mongo-db:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: P@ssw0rd
    depends_on:
      - mongo-db
      - redis-db
  redis-db:
    container_name: redis-db-container
    image: redis
    ports:
      - "6379:6379"
    restart: always
  nginx:
    container_name: nginx-container
    depends_on:
      - node-app
    image: nginx:stable-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8085:80"
  postgres-db:
    container_name: postgres-db-container
    image: postgres
    volumes:
      - postgres-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: P@ssw0rd

volumes:
  mongo-db:
  postgres-db: