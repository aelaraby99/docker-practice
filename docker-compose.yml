services: 
  node-app: 
    image: aelaraby999/express-node-app
    environment:
      - NODE_ENV=production
      - PORT=4000
      - REDIS_HOST=redis-db
      - REDIS_PORT=6379
      - DB_HOST=mongo-db
      - DB_PORT=27017
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=P@ssw0rd
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=P@ssw0rd
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
    deploy:
      replicas: 3
      update_config:
        parallelism: 2
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    depends_on:
      - mongo-db
      - postgres-db
      - redis-db
    networks:
      - app-network
  mongo-db:
    container_name: mongo-db-container
    image: mongo
    volumes:
      - mongo-db:/data/db
    ports:
      - "27017:27017"
    restart: always # To restart the container if it stops
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: P@ssw0rd
    networks:
      - app-network
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:P%40ssw0rd@mongo-db:27017/
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: P@ssw0rd
    depends_on:
      - mongo-db
      - redis-db
    networks:
      - app-network
  redis-db:
    container_name: redis-db-container
    image: redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - app-network
  nginx:
    container_name: nginx-container
    depends_on:
      - node-app
    image: nginx:stable-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8085:80"
    networks:
      - app-network
  postgres-db:
    container_name: postgres-db-container
    image: postgres
    volumes:
      - postgres-db:/var/lib/postgresql
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: P@ssw0rd
    networks:
      - app-network

volumes:
  mongo-db:
  postgres-db:
networks:
  app-network:
    external: true
    name: app-network